# Orchestrator Kit: livepeer/node (paid orchestrator) + Caddy (TLS, outputs) + HyperFrames runner.
# Rendered by `lpo init` from lpo.yaml; ${VARS} come from .env, which lpo writes.
name: lpo
services:
  orchestrator:
    image: docker.io/livepeer/node:v1.0.5@sha256:511783baf44d53bd8d2aef92e80574e52d95e9434442f530644006f48605cbf4
    command: [orchestrator, --config, /etc/livepeer/config.toml]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    volumes:
      - ./config.toml:/etc/livepeer/config.toml:ro
      - ./secrets/runner-bootstrap:/run/secrets/runner-bootstrap:ro
      - ./secrets/wallet-keystore:/run/secrets/wallet-keystore:ro
      - ./secrets/wallet-password:/run/secrets/wallet-password:ro
      - ./secrets/arbitrum-rpc-url:/run/secrets/arbitrum-rpc-url:ro
      - orchestrator_state:/home/livepeer/.lpData
    networks: {kit: {ipv4_address: 172.19.0.2}}
    healthcheck:
      test: [CMD, bash, -ec, "exec 3<>/dev/tcp/127.0.0.1/8936; printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3; head -n 1 <&3 | grep -q ' 200 '"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s
  caddy:
    image: docker.io/library/caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment: {HOST: "${HOST}"}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - outputs:/srv/outputs:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: {kit: {ipv4_address: 172.19.0.3}}
    depends_on: {orchestrator: {condition: service_healthy}}
  hyperframes:
    build: ./runners/hyperframes
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    environment:
      ORCH_URL: http://caddy:8080
      ORCH_SECRET: "${ORCH_SECRET}"
      RUNNER_URL: http://172.19.0.13:8993
      APP_NAME: "${APP_NAME}"
      PRICE_USD: "${PRICE_USD}"
      CAPACITY: "${CAPACITY}"
      PUBLIC_BASE_URL: "https://${HOST}/outputs"
    volumes: [outputs:/outputs]
    networks: {kit: {ipv4_address: 172.19.0.13}}
    depends_on: [caddy]
volumes: {orchestrator_state: {}, outputs: {}, caddy_data: {}, caddy_config: {}}
networks:
  kit:
    driver: bridge
    ipam: {config: [{subnet: 172.19.0.0/24, ip_range: 172.19.0.128/25}]}
